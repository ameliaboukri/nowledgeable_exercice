name: GitHub Actions Demo
on:
  push:
  workflow_dispatch:
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "le secret est-il accessible ? -> $SECRET_API_TOKEN"
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}
      - run: python job.py
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}