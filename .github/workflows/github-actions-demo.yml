name: GitHub Actions Demo
on:
  push:
  workflow_dispatch:
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python job.py
      - run: echo "coucou artefact" > resultat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mon-artefact
          path: resultat.txt